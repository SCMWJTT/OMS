name: ONE API (Cloudflare Worker)
# Deploys the comments service to oms-api.cynmark.app.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install wrangler
        working-directory: worker
        run: npm install --no-save wrangler@3
      - name: Create the database if it is missing
        working-directory: worker
        run: |
          find_id () { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const d=a.find(x=>x.name==="one-comments");console.log(d?(d.uuid||d.id):"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create one-comments; ID=$(find_id); fi
          echo "Database id: $ID"
          test -n "$ID"
          sed -i "s/DATABASE_ID/$ID/" wrangler.toml
      - name: Create the tables if they are missing
        working-directory: worker
        run: npx wrangler d1 execute one-comments --remote --file schema.sql
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy
      - name: Check it answers
        run: sleep 20; curl -fsS https://oms-api.cynmark.app/health || echo "Not answering yet; the new domain can take a few minutes."
